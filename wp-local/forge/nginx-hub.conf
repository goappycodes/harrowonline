# Laravel Forge nginx rules for the Hub WordPress. The site's web directory is /wp-local, so WordPress is served
# at /hub/ exactly as locally and on harrowonline.org/hub/. In Forge: Site > Nginx configuration, replace the
# default `location / { ... }` block with these (keep them above Forge's `location ~ \.php$` block, since nginx
# uses the first matching regex location).

add_header X-Robots-Tag "noindex, nofollow" always;   # dev site: keep it out of search engines

location / { return 302 /hub/; }   # /, router.php and anything outside /hub (like the local router)

location /hub/ {
    try_files $uri $uri/ /hub/index.php?$query_string;
}

# Never serve the database, logs, the local login note or the local CLI scripts
location ^~ /hub/wp-content/database/ { return 404; }
location ^~ /hub/wp-content/mail-log/ { return 404; }
location ^~ /hub/wp-content/hub-private/ { return 404; }
location ~ ^/hub/(LOCAL-ADMIN\.txt|wp-content/debug\.log)$ { return 404; }
location ~ ^/hub/(setup-local|install-local|import-local|acf-migrate-local|stripe-setup-local|billing-webhook-test-local|seed-test-accounts-local|update-classes-local|wp-config)\.php$ { return 404; }
location = /hub/xmlrpc.php { return 404; }

# wp-admin and the login page sit behind an extra HTTP password: the dev site's WordPress logins are the local ones
# from the committed database. The password file is outside git: /home/forge/<site>/.htpasswd-hub
# (create it with: printf 'USER:%s\n' "$(openssl passwd -apr1 'PASSWORD')" > .htpasswd-hub). The PHP lines below
# copy Forge's own `location ~ \.php$` block; match the PHP version to the site's.
location ^~ /hub/wp-admin/ {
    auth_basic "Harrow Hub dev";
    auth_basic_user_file /home/forge/SITE_DOMAIN/.htpasswd-hub;
    try_files $uri $uri/ /hub/index.php?$query_string;
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }
}
location = /hub/wp-login.php {
    auth_basic "Harrow Hub dev";
    auth_basic_user_file /home/forge/SITE_DOMAIN/.htpasswd-hub;
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
}
