# Deploy the Hub to the SiteGround test site (https://hub.harrowonline.org/hub/) on every push to main, so the
# test site matches git main: the code, the committed SQLite database (wp-local/hub/wp-content/database/) and the
# uploads. Anything made only on the test site (accounts, sign-ups, payments) is replaced on the next deploy; put
# what should stay into the committed database.
# Kept on the server: its .htaccess (access rules), .user.ini, private claim files (hub-private), the mail log and
# debug log, and its settings file (~/www/hub.harrowonline.org/.env, outside the site folder). LOCAL-ADMIN.txt is
# never uploaded.
#
# Secrets (GitHub > Settings > Secrets and variables > Actions):
#   SITEGROUND_SSH_KEY      private key whose public half is in SiteGround Site Tools > Devs > SSH Keys Manager
#   SITEGROUND_SSH_HOST     e.g. ssh.harrowonline.org
#   SITEGROUND_SSH_USER     the SiteGround SSH username
#   SITEGROUND_SSH_PORT     18765
#   SITEGROUND_KNOWN_HOSTS  the server's host key line (ssh-keyscan -p 18765 -t ed25519 HOST)
name: Deploy to SiteGround test site

on:
  push:
    branches: [main]
    paths:
      - 'wp-local/hub/**'
      - '.github/workflows/deploy-siteground.yml'
  workflow_dispatch:

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: www/hub.harrowonline.org/public_html/hub
    steps:
      - uses: actions/checkout@v4

      - name: SSH key and known host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SITEGROUND_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SITEGROUND_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy the site from git (code, database, uploads)
        run: |
          rsync -rlptz --delete --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p ${{ secrets.SITEGROUND_SSH_PORT }}" \
            --exclude '/.htaccess' \
            --exclude '/.user.ini' \
            --exclude '/LOCAL-ADMIN.txt' \
            --exclude '/wp-content/mail-log/' \
            --exclude '/wp-content/hub-private/' \
            --exclude '/wp-content/debug.log' \
            --exclude '/wp-content/upgrade/' \
            --exclude '/wp-content/cache/' \
            --exclude '/wp_auto_login_*.php' \
            wp-local/hub/ "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}:${TARGET}/"

      - name: Clear the database's journal files
        # SQLite's write-ahead log from the old database would not match the new one (as the old Forge deploy did)
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p ${{ secrets.SITEGROUND_SSH_PORT }} \
            "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}" \
            "rm -f ${TARGET}/wp-content/database/hub.sqlite-wal ${TARGET}/wp-content/database/hub.sqlite-shm && ls -la ${TARGET}/wp-content/database/"

      - name: Check the site answers
        # Run on the server: SiteGround's bot check answers GitHub's machines with 202, not the real page
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p ${{ secrets.SITEGROUND_SSH_PORT }}             "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}" '
            set -e
            cd "$HOME/'"${TARGET}"'"
            wp eval "echo \"WordPress loads: \", home_url(), PHP_EOL;"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://hub.harrowonline.org/hub/)
            echo "https://hub.harrowonline.org/hub/ answered ${code}"
            test "${code}" = "200"
            db=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://hub.harrowonline.org/hub/wp-content/database/hub.sqlite)
            echo "database file answered ${db} (must not be 200)"
            test "${db}" != "200"
            test ! -e LOCAL-ADMIN.txt
          '

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
